[package]
name = "mongo-compare"
version = "0.1.0"
edition = "2021"

[dependencies]
mongodb = "3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
env_logger = "0.11"
chrono = "0.4"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
futures-util = "0.3"
anyhow = "1.0"
actix-web = { version = "4.9", features = ["macros"] }
actix-cors = "0.7"
serde_qs = "0.13"
bytes = "1.7"
log = "0.4"

[lib]
name = "mongo_compare"
path = "src/lib.rs"

[[bin]]
name = "mongo-compare"
path = "src/main.rs"

[[bin]]
name = "mongo-compare-server"
path = "src/server.rs"

[dev-dependencies]
testcontainers = "0.15"
