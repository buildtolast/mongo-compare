[package]
name = "mongo-compare"
version = "0.1.0"
edition = "2021"

[dependencies]
mongodb = "3.1.2"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
env_logger = "0.11.5"
chrono = "0.4.31"
tokio = { version = "1.37.0", features = ["rt-multi-thread", "macros"] }
futures = "0.3.30"
futures-util = "0.3.30"
anyhow = "1.0.79"
actix-web = "4.6.0"
actix-cors = "0.7.0"
serde_qs = "0.13.0"
bytes = "1.6.0"
log = "0.4.21"

[lib]
name = "mongo_compare"
path = "src/lib.rs"

[[bin]]
name = "mongo-compare"
path = "src/main.rs"

[[bin]]
name = "mongo-compare-server"
path = "src/server.rs"

[dev-dependencies]
testcontainers = "0.15"
