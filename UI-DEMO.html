<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MongoDB Compare - Polished UI Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
    }
    
    .glow-emerald {
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
    }
    
    .glow-cyan {
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.6);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div class="max-w-7xl mx-auto p-6">
    <header class="mb-8">
      <h1 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">
        MongoDB Compare
      </h1>
      <p class="text-slate-400 mt-2">
        Compare MongoDB databases and detect inserted, updated, and deleted documents
      </p>
    </header>

    <!-- Tabs Navigation -->
    <div class="mb-6">
      <div class="inline-flex rounded-lg bg-slate-800 p-1">
        <button class="px-6 py-2.5 rounded-md bg-slate-700 text-white font-medium shadow-sm">
          Configure
        </button>
        <button class="px-6 py-2.5 rounded-md text-slate-400 hover:text-slate-200 transition-colors">
          Results
        </button>
      </div>
    </div>

    <!-- Connection Configuration -->
    <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">
      <!-- Source Database -->
      <div class="relative overflow-hidden rounded-2xl border border-slate-700 bg-slate-800 p-6 hover:border-emerald-500/30 transition-all">
        <div class="absolute top-0 left-0 h-1 w-full bg-gradient-to-r from-emerald-500 to-teal-500"></div>
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-semibold text-emerald-400">Source Database</h2>
          <button class="text-xs font-medium text-emerald-500 hover:text-emerald-400 transition-colors">
            Use defaults
          </button>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Connection String</label>
            <input type="text" value="mongodb://localhost:27017" class="w-full rounded-lg border border-slate-600 bg-slate-900 px-4 py-2.5 text-slate-100 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Database Name</label>
            <input type="text" value="sourcedb" class="w-full rounded-lg border border-slate-600 bg-slate-900 px-4 py-2.5 text-slate-100 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all">
          </div>

          <div class="border-t border-slate-700 pt-4">
            <h3 class="mb-3 text-sm font-medium text-slate-300">Authentication</h3>
            <div class="space-y-3">
              <input type="text" placeholder="Username" class="w-full rounded-lg border border-slate-600 bg-slate-900 px-4 py-2.5 text-slate-100 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all">
              <input type="password" placeholder="Password" class="w-full rounded-lg border border-slate-600 bg-slate-900 px-4 py-2.5 text-slate-100 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all">
              <input type="text" placeholder="Auth Database" class="w-full rounded-lg border border-slate-600 bg-slate-900 px-4 py-2.5 text-slate-100 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all">
            </div>
          </div>
        </div>
      </div>

      <!-- Target Database -->
      <div class="relative overflow-hidden rounded-2xl border border-slate-700 bg-slate-800 p-6 hover:border-cyan-500/30 transition-all">
        <div class="absolute top-0 left-0 h-1 w-full bg-gradient-to-r from-cyan-500 to-blue-500"></div>
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-semibold text-cyan-400">Target Database</h2>
          <button class="text-xs font-medium text-cyan-500 hover:text-cyan-400 transition-colors">
            Use defaults
          </button>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Connection String</label>
            <input type="text" value="mongodb://localhost:27018" class="w-full rounded-lg border border-slate-600 bg-slate-900 px-4 py-2.5 text-slate-100 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20 transition-all">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Database Name</label>
            <input type="text" value="targetdb" class="w-full rounded-lg border border-slate-600 bg-slate-900 px-4 py-2.5 text-slate-100 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20 transition-all">
          </div>

          <div class="border-t border-slate-700 pt-4">
            <h3 class="mb-3 text-sm font-medium text-slate-300">Authentication</h3>
            <div class="space-y-3">
              <input type="text" placeholder="Username" class="w-full rounded-lg border border-slate-600 bg-slate-900 px-4 py-2.5 text-slate-100 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20 transition-all">
              <input type="password" placeholder="Password" class="w-full rounded-lg border border-slate-600 bg-slate-900 px-4 py-2.5 text-slate-100 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20 transition-all">
              <input type="text" placeholder="Auth Database" class="w-full rounded-lg border border-slate-600 bg-slate-900 px-4 py-2.5 text-slate-100 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20 transition-all">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Security Settings -->
    <div class="rounded-2xl border border-slate-700 bg-slate-800 p-6 mt-6">
      <h2 class="mb-4 text-lg font-semibold text-slate-200">Security Settings</h2>
      <div class="space-y-4">
        <div class="flex items-center gap-3">
          <input type="checkbox" id="tls" class="h-4 w-4 rounded border-slate-600 bg-slate-700 text-emerald-500 focus:ring-emerald-500/20">
          <label for="tls" class="text-sm font-medium text-slate-300">Enable TLS/SSL for both connections</label>
        </div>
        <div class="flex flex-wrap items-center gap-6">
          <div class="flex items-center gap-3 rounded-lg bg-slate-900/50 px-4 py-2">
            <div class="h-3 w-3 rounded-full bg-emerald-500 glow-emerald"></div>
            <span class="text-sm font-medium text-slate-300">Source: Connected</span>
          </div>
          <div class="flex items-center gap-3 rounded-lg bg-slate-900/50 px-4 py-2">
            <div class="h-3 w-3 rounded-full bg-cyan-500 glow-cyan"></div>
            <span class="text-sm font-medium text-slate-300">Target: Connected</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="rounded-2xl border border-slate-700 bg-slate-800 p-6 mt-6">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-4">
          <button class="flex items-center gap-2 rounded-lg bg-emerald-600 px-5 py-2.5 font-medium text-white hover:bg-emerald-700 transition-colors">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
            </svg>
            Test Source
          </button>
          <button class="flex items-center gap-2 rounded-lg bg-emerald-600 px-5 py-2.5 font-medium text-white hover:bg-emerald-700 transition-colors">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
            </svg>
            Test Target
          </button>
        </div>
        <div class="flex items-center gap-6">
          <span class="flex items-center text-sm font-medium text-emerald-400">
            <svg class="mr-2 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
            </svg>
            Connection successful
          </span>
        </div>
      </div>
    </div>

    <!-- Run Comparison Section -->
    <div class="rounded-2xl bg-gradient-to-r from-emerald-600/10 to-cyan-600/10 p-6 border border-slate-700/50 mt-6">
      <div class="flex flex-col items-center justify-center gap-4">
        <div class="flex items-center gap-4">
          <div class="h-3 w-3 rounded-full bg-emerald-500 glow-emerald"></div>
          <span class="text-sm font-medium text-slate-300">Source ready</span>
        </div>
        <div class="flex items-center gap-4">
          <div class="h-3 w-3 rounded-full bg-cyan-500 glow-cyan"></div>
          <span class="text-sm font-medium text-slate-300">Target ready</span>
        </div>
      </div>
      <div class="mt-6 flex justify-center gap-4">
        <button class="flex items-center gap-2 rounded-lg border border-slate-600 bg-transparent px-5 py-2.5 font-medium text-slate-300 hover:bg-slate-800 transition-colors">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          Reset
        </button>
        <button class="flex items-center gap-2 rounded-lg bg-gradient-to-r from-emerald-600 to-cyan-600 px-8 py-3 font-semibold text-white shadow-lg shadow-emerald-500/20 hover:shadow-emerald-500/40 hover:scale-105 transition-all min-w-[160px]">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
          </svg>
          Run Comparison
        </button>
      </div>
    </div>
  </div>
</body>
</html>
